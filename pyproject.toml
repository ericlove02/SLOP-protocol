[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "slop-protocol"
version = "0.1.0"
description = "SLOP: the Semantically Lossy Object Protocol. Send a description of an image instead of the image."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Love" }]
keywords = ["image", "compression", "lossy", "protocol", "satire", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Networking",
]
dependencies = [
    "pillow>=10.1",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.60"]
gemini = ["google-genai>=1.30"]
brotli = ["brotli>=1.1"]
qr = ["qrcode[pil]>=7.4", "zxing-cpp>=2.2"]
stability = ["httpx>=0.27"]
replicate = ["replicate>=1.0"]
local = ["diffusers>=0.30", "torch>=2.2", "transformers>=4.40", "accelerate>=0.30"]
bench = ["scikit-image>=0.22", "matplotlib>=3.8"]
clip = ["open_clip_torch>=2.24", "torch>=2.2"]
all = [
    "slop-protocol[anthropic,openai,gemini,brotli,qr,bench]",
]
dev = [
    "slop-protocol[all]",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
slop = "slop.cli:app"

[project.urls]
Homepage = "https://github.com/ericlove02/SLOP-protocol"
Specification = "https://github.com/ericlove02/SLOP-protocol/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/slop"]

[tool.hatch.build.targets.sdist]
include = ["src/slop", "README.md", "SPEC.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Markdown/report rendering is mostly long f-strings; wrapping them hurts more than it helps.
"src/slop/bench/report.py" = ["E501"]
"src/slop/bench/run.py" = ["E501"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real paid APIs; run with `pytest -m live` and real keys",
]
